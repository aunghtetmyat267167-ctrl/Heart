<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Smooth & Slow Heart</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070a; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let lastTime = 0;
    const particles = [];
    const particleCount = 70;
    const text = "I love you"; 

    function getHeartPoint(t) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x: x * 18, y: y * 18 };
    }

    class Particle {
        constructor(t) {
            this.t = t;
            this.speed = 0.1 + Math.random() * 0.15; 
            this.size = 12 + Math.random() * 6;
            this.opacity = 0.4 + Math.random() * 0.5;
        }

        update(deltaTime) {
            this.t += (this.speed * deltaTime) / 1000;
            this.pos = getHeartPoint(this.t);
        }

        draw() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(255, 40, 100, 0.3)";
            ctx.fillStyle = `rgba(255, 70, 110, ${this.opacity})`;
            ctx.font = `bold ${this.size}px 'Segoe UI', Arial, sans-serif`;
            
 
            const xPos = canvas.width / 2 + this.pos.x;
            const yPos = canvas.height / 2 + this.pos.y;
            
            ctx.fillText(text, xPos, yPos);
            ctx.shadowBlur = 0;
        }
    }

    // Particle အားလုံးကို မတူညီတဲ့ နေရာတွေမှာ စတင်စေတယ်
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle(Math.random() * Math.PI * 2));
    }

    function animate(currentTime) {
        // အချိန်ကွာခြားချက်ကို တွက်ချက်ခြင်း (Smoothness အတွက် အဓိက)
        const deltaTime = currentTime - lastTime;
        lastTime = currentTime;

        // Trail effect ကို ပိုသိသာအောင် opacity အရမ်းလျှော့ထားတယ်
        ctx.fillStyle = 'rgba(5, 7, 10, 10)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.update(deltaTime);
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    // ပထမဆုံး frame စတင်ခြင်း
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
